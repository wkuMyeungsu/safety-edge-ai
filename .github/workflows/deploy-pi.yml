# Pi 배포: Actions 탭 → deploy-pi → Run workflow 에서 브랜치를 골라 실제 Pi에 올린다.
#   deploy  : Pi의 저장소를 그 브랜치로 바꾸고 docker compose up --build (healthy까지 기다림)
#             끝나면 hold_minutes 동안 "시험 중"으로 표시해 다른 사람의 deploy를 막는다
#   status  : 바꾸지 않고 지금 Pi 커밋, 시험 중 표시, 컨테이너 상태, 최근 로그만 본다
#   release : 시험 중 표시를 푼다 (시험이 끝나면 올린 사람이 누른다)
# 막히면 실행이 바로 실패하고, 누가 무엇을 하고 있어서 막혔는지 실행 화면 맨 위(Summary)에 남긴다.
#   - 다른 deploy·release가 아직 돌고 있음 → busy job이 멈춘다 (기다리다 조용히 취소되지 않게)
#   - 다른 사람이 시험 중 (hold_minutes 안, 명수가 Pi에서 직접 건 pi-deploy hold 포함) → deploy 단계가 멈춘다
# 규칙은 pi/deploy.sh에 있고, 명수가 Pi에서 직접 작업할 때도 같은 스크립트(pi-deploy)를 쓴다.
# 실행은 Pi에 설치한 self-hosted runner(라벨 pi)가 한다. 설치는 pi/README.md "Pi 배포".
#
# public 저장소라서:
#   - 트리거는 workflow_dispatch만 (write 권한이 있는 팀원만 누를 수 있다). pull_request·push를 넣지 않는다
#   - 로그는 누구나 볼 수 있다. docker compose config(.env 값이 펼쳐짐)·env 출력을 넣지 않는다
name: deploy-pi
run-name: ${{ inputs.action }} ${{ inputs.ref }} (${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 올릴 브랜치 또는 커밋 (예 dev, feature/pi/xxx)
        required: true
        default: dev
      action:
        description: deploy = 받아서 다시 빌드, status = 상태·로그만 보기, release = 시험 중 표시 풀기
        type: choice
        options: [deploy, status, release]
        default: deploy
      hold_minutes:
        description: deploy 뒤 다른 사람의 deploy를 막아 둘 시간(분, 0~240). 0이면 막지 않는다
        type: number
        default: 30

permissions:
  contents: read
  actions: read   # busy job이 먼저 돌고 있는 실행을 찾는다

jobs:
  busy:
    if: inputs.action != 'status'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 먼저 누른 배포가 돌고 있는지
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # 이 실행보다 먼저 만들어졌고 아직 안 끝난 deploy·release (status는 읽기만 하므로 뺀다)
          busy=$(gh run list --workflow deploy-pi.yml --limit 20 \
            --json databaseId,status,displayTitle,createdAt,url \
            --jq "[.[] | select(.databaseId < $RUN_ID and .status != \"completed\" and (.displayTitle | startswith(\"status \") | not))]
                  | first // empty
                  | \"\(.displayTitle), \(.createdAt | fromdate + 32400 | strftime(\"%H:%M\")) 시작 · \(.url)\"")
          if [ -n "$busy" ]; then
            msg="다른 배포가 아직 돌고 있어 멈춤: $busy — 끝난 뒤 다시 누른다"
            echo "::error::$msg"; echo "### 멈춤: $msg" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

  pi:
    needs: busy
    if: ${{ !cancelled() && needs.busy.result != 'failure' }}   # status는 busy가 건너뛰어도 돈다
    runs-on: [self-hosted, pi]
    timeout-minutes: 40   # Pi에서 처음 빌드하면 오래 걸린다
    concurrency:
      group: deploy-pi-${{ inputs.action == 'status' && 'status' || 'change' }}
      cancel-in-progress: false
    env:
      REF: ${{ inputs.ref }}
      ACTION: ${{ inputs.action }}
      HOLD: ${{ inputs.hold_minutes }}
      PI_DIR: ${{ vars.PI_DIR }}   # 저장소 변수. 비우면 ~/safety-edge-ai
    steps:
      # 규칙은 pi/deploy.sh 하나에 있다. Pi 저장소가 옛 브랜치여도 이 실행의 최신본을 쓰고,
      # 명수가 Pi에서 직접 쓰는 pi-deploy도 같은 최신본으로 바꿔 둔다
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pi/deploy.sh
          sparse-checkout-cone-mode: false
      - name: pi-deploy 최신본 설치
        run: install -D -m 755 pi/deploy.sh "$HOME/.local/bin/pi-deploy"

      - name: ${{ inputs.action }}
        if: inputs.action != 'status'
        run: |
          case "$ACTION" in
            deploy)  "$HOME/.local/bin/pi-deploy" deploy "$REF" "$HOLD" ;;
            release) "$HOME/.local/bin/pi-deploy" release ;;
          esac

      - name: 상태·최근 로그
        if: always()
        run: '"$HOME/.local/bin/pi-deploy" status'
