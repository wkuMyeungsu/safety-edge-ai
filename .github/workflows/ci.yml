# PR마다 바뀐 파트만 검사한다. 브랜치 보호 규칙은 마지막 ci-ok 하나만 필수로 건다.
#   changes : 바뀐 경로로 돌 job을 고른다. 계약·공용 테스트 설정이 바뀌거나 main으로 가는 PR이면 전부 돈다
#   lint    : ruff (항상, 수 초)
#   pi      : arm64 러너에서 compose 빌드(캐시) → 기동(healthcheck) → pytest tests/pi tests/e2e tests/contracts
#   esp32   : 펌웨어 컴파일(코어·빌드 캐시) → pytest tests/esp32
#   cloud   : 로컬 Supabase에 schema.sql 적용 → pytest tests/cloud
#   web     : pytest tests/web
#   (pi/uploader는 cloud 담당이지만 Pi 컨테이너라 pi job에서 검사한다)
# 테스트는 tests/<파트>/에 test_*.py 를 넣으면 이 파일을 고치지 않아도 돈다 (tests/README.md).
#
# 지난 프로젝트 CI 병목(2분 → 8분)을 피하려고:
#   - 트리거는 pull_request만. 작업 브랜치 push, dev 병합 push에서 같은 코드를 다시 검사하지 않는다
#   - 같은 PR에 새 커밋이 오면 이전 실행을 취소한다
#   - 모델 변환(torch·ultralytics)은 CI에서 하지 않는다. ONNX는 Release에서 받아 캐시한다
#   - 이미지 빌드·arduino 빌드는 캐시한다
name: ci

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      esp32: ${{ steps.f.outputs.esp32 == 'true' || steps.all.outputs.all == 'true' }}
      pi: ${{ steps.f.outputs.pi == 'true' || steps.all.outputs.all == 'true' }}
      cloud: ${{ steps.f.outputs.cloud == 'true' || steps.all.outputs.all == 'true' }}
      web: ${{ steps.f.outputs.web == 'true' || steps.all.outputs.all == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            esp32:
              - 'esp32/**'
              - 'tests/esp32/**'
            pi:
              - 'pi/**'
              - 'tests/pi/**'
              - 'tests/e2e/**'
              - 'tests/fixtures/**'
            cloud:
              - 'cloud/**'
              - 'tests/cloud/**'
            web:
              - 'web/**'
              - 'tests/web/**'
              - 'cloud/supabase/schema.sql'   # tests/web이 웹이 읽는 컬럼을 schema.sql과 대조한다
            common:
              - 'docs/contracts/**'
              - 'tests/contracts/**'
              - 'tests/conftest.py'
              - 'tests/requirements.txt'
              - 'pytest.ini'
              - '.github/workflows/**'
      - id: all
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
             || [ "${{ github.base_ref }}" = "main" ] \
             || [ "${{ steps.f.outputs.common }}" = "true" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pipx run --spec ruff==0.8.6 ruff check .

  pi:
    needs: changes
    if: needs.changes.outputs.pi == 'true'
    runs-on: ubuntu-24.04-arm   # 라즈베리 파이와 같은 arm64 (public 저장소는 무료)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 모델 캐시
        uses: actions/cache@v4
        with:
          path: pi/models/*.onnx
          key: model-${{ hashFiles('pi/models/README.md') }}
      - name: 모델 받기 (model 테스트가 있고 Release model-v1이 있을 때만)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -rqs "mark.model" tests/; then echo "model 테스트 없음. 받지 않음"; exit 0; fi
          if ls pi/models/*.onnx >/dev/null 2>&1; then echo "캐시에서 복원됨"; exit 0; fi
          gh release download model-v1 -p '*.onnx' -D pi/models \
            || echo "::notice::Release model-v1 없음. @pytest.mark.model 테스트는 건너뜀"

      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3   # 아래 bake가 gha 캐시를 쓰도록 토큰을 넘긴다
      - name: 이미지 빌드 (requirements가 그대로면 설치 단계는 캐시에서)
        working-directory: pi
        run: |
          set_args=()
          for s in gateway inference uploader; do
            set_args+=(--set "$s.cache-from=type=gha,scope=$s")
            set_args+=(--set "$s.cache-to=type=gha,scope=$s,mode=max")
          done
          docker buildx bake -f docker-compose.yml --load "${set_args[@]}"

      - name: 기동 (healthcheck 통과까지)
        working-directory: pi
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build --wait --wait-timeout 120

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: pytest (테스트가 0개면 통과)
        run: pytest tests/pi tests/e2e tests/contracts -m "not pi and not supabase" || [ $? -eq 5 ]

      - name: 실패하면 로그
        if: failure()
        working-directory: pi
        run: docker compose ps && docker compose logs --no-color --tail 200
      # compose down은 하지 않는다. 러너는 job이 끝나면 버려진다 (정리에 20초 이상 걸렸다)

  esp32:
    needs: changes
    if: needs.changes.outputs.esp32 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # XIAO ESP32S3는 PSRAM을 OPI로 켜야 카메라가 동작한다
      FQBN: esp32:esp32:XIAO_ESP32S3:PSRAM=opi
      ESP32_CORE: "3.3.12"
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - name: 코어·빌드 캐시 (모델 zip이 그대로면 모델 컴파일 결과 재사용)
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: arduino-${{ env.ESP32_CORE }}-${{ hashFiles('esp32/model/*.zip') }}
          restore-keys: arduino-${{ env.ESP32_CORE }}-
      - uses: arduino/setup-arduino-cli@v2
      - name: esp32 코어
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core list | grep -q "esp32:esp32 *$ESP32_CORE" \
            || arduino-cli core install "esp32:esp32@$ESP32_CORE" --additional-urls "$ESP32_INDEX"
      - name: Edge Impulse 라이브러리 (esp32/model/*.zip)
        run: |
          mkdir -p ~/Arduino/libraries
          for z in esp32/model/*.zip; do
            [ -e "$z" ] || { echo "모델 zip 없음"; break; }
            unzip -q -o "$z" -d ~/Arduino/libraries
          done
      - run: cp esp32/firmware/safety_cam/config.example.h esp32/firmware/safety_cam/config.h
      - name: 컴파일
        run: arduino-cli compile --fqbn "$FQBN" esp32/firmware/safety_cam
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - name: pytest (테스트가 0개면 통과)
        run: pytest tests/esp32 -m "not pi and not supabase" || [ $? -eq 5 ]

  cloud:
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      # 로컬 Supabase 기동은 1분 30초 이상 걸린다. tests/cloud에 테스트가 생기면 그때부터 띄운다
      - name: tests/cloud에 테스트가 있는지
        id: t
        run: |
          if ls tests/cloud/test_*.py >/dev/null 2>&1; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/cloud에 테스트가 없어 Supabase를 띄우지 않음"
          fi
      - if: steps.t.outputs.has == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 로컬 Supabase 기동
        if: steps.t.outputs.has == 'true'
        run: |
          mkdir -p /tmp/sb && cd /tmp/sb
          supabase init < /dev/null
          supabase start
      - name: schema.sql 적용
        if: steps.t.outputs.has == 'true'
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f cloud/supabase/schema.sql
      - if: steps.t.outputs.has == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.t.outputs.has == 'true'
        run: pip install -r tests/requirements.txt
      - name: pytest
        if: steps.t.outputs.has == 'true'
        run: pytest tests/cloud -m "not pi"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: pytest (테스트가 0개면 통과)
        run: pytest tests/web -m "not pi and not supabase" || [ $? -eq 5 ]

  ci-ok:
    if: always()
    needs: [changes, lint, pi, esp32, cloud, web]
    runs-on: ubuntu-24.04
    steps:
      - name: 실패·취소된 job이 없으면 통과 (건너뛴 job은 통과로 본다)
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs.*.result) }}' | grep -qE '"(failure|cancelled)"'; then exit 1; fi
